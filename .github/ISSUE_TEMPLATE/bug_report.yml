name: Bug report
description: Report a problem in Sagax AI 1.5.8
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Please do not include API keys, passwords, private interview audio or
        transcripts, or screenshots containing sensitive information.
  - type: input
    id: version
    attributes:
      label: Sagax version
      description: The current primary build is 1.5.8.
      placeholder: 1.5.8
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which mode were you using?
      options:
        - API Mode
        - GPT Mode
        - Both / switching modes
        - Not sure
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: For example, Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: List the steps that make the problem happen.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed keys, passwords, private conversation content, and personal data.
          required: true
